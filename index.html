<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14286b">
<link rel="icon" id="favicon" href="data:,">
<title>Civic Sense AI – Sangamner Nagarpalika</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<style>
  :root{
    --primary:#14286b; --primary-2:#2346c4; --saffron:#ff7a00; --saffron-2:#ffb347;
    --women:#e11d48; --women-2:#be185d; --noise:#7c3aed; --noise-2:#4338ca;
    --danger:#dc2626; --ok:#15803d; --bg:#f4f6fb; --card:#ffffff;
    --text:#111827; --muted:#5b6475; --border:#dde3ee; --radius:18px;
    --shadow:0 10px 30px rgba(20,40,107,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Mukta',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:16px}
  h1,h2,h3,.bold{font-family:'Baloo 2','Mukta',sans-serif;font-weight:800;letter-spacing:.2px}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}
  .hidden{display:none!important}
  .small{font-size:13px;color:var(--muted)}

  /* ---------- Top language bar ---------- */
  .topbar{background:#0b1740;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:6px 14px;font-size:13px}
  .topbar .tag{opacity:.85;font-weight:600}
  .lang{display:flex;background:rgba(255,255,255,.12);border-radius:30px;padding:3px}
  .lang button{border:none;background:none;color:#fff;font-weight:800;font-size:13px;padding:4px 14px;border-radius:30px;transition:.2s}
  .lang button.active{background:var(--saffron);color:#fff;box-shadow:0 2px 8px rgba(255,122,0,.5)}

  /* ---------- Header ---------- */
  header{background:linear-gradient(120deg,var(--primary) 0%,var(--primary-2) 60%,#3b5bdb 100%);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20;box-shadow:0 6px 20px rgba(20,40,107,.35);overflow:hidden}
  header::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);transform:translateX(-100%);animation:shine 6s infinite}
  @keyframes shine{60%,100%{transform:translateX(100%)}}
  .head-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
  .brand{display:flex;align-items:center;gap:12px}
  .brand h1{font-size:22px;line-height:1}
  .brand .corp{font-family:'Baloo 2';font-weight:700;font-size:15px;color:var(--saffron-2)}
  .brand .slogan{font-size:12px;opacity:.85;font-weight:600}
  .user{text-align:right;font-size:13px;font-weight:700}
  @media(max-width:480px){
    .brand h1{font-size:19px;white-space:nowrap}
    .brand .corp{font-size:13px}
    .logo{width:56px;height:56px}
    .user #userName{max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  }
  .user button{margin-top:4px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:700}

  /* ---------- Dynamic logo ---------- */
  .logo{width:66px;height:66px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
  .logo.big{width:160px;height:160px;margin:0 auto 8px;display:block;filter:drop-shadow(0 12px 24px rgba(20,40,107,.35))}
  .logo .rot{transform-origin:100px 100px;animation:spin 40s linear infinite}
  .logo .rays{transform-origin:100px 96px;animation:spin 30s linear infinite}
  .logo .glow{transform-origin:100px 96px;animation:pulse 3s ease-in-out infinite}
  .logo .flow{animation:flow 2.2s linear infinite}
  .logo .flow.f2{animation-duration:3s}
  .logo .shim{animation:shim 2.2s ease-in-out infinite}
  .logo .s2{animation-delay:.6s}.logo .s3{animation-delay:1.2s}
  .logo .tw{animation:shim 3s ease-in-out infinite}.logo .t2{animation-delay:1s}.logo .t3{animation-delay:2s}
  .logo .flag{transform-origin:50px 85px;animation:flag .9s ease-in-out infinite alternate}
  .logo .birds{animation:birds 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.12);opacity:.55}}
  @keyframes flow{to{stroke-dashoffset:-48}}
  @keyframes shim{50%{opacity:.25}}
  @keyframes flag{to{transform:scaleX(.65) skewY(4deg)}}
  @keyframes birds{from{transform:translate(-12px,4px)}to{transform:translate(150px,-6px)}}
  @media(prefers-reduced-motion:reduce){.logo *{animation:none!important}}

  main{max-width:1080px;margin:0 auto;padding:18px 14px 90px}

  .card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px}

  /* ---------- Auth ---------- */
  .auth-wrap{max-width:460px;margin:10px auto}
  .auth-hero{text-align:center;margin-bottom:14px}
  .auth-hero h2{font-size:28px;color:var(--primary);line-height:1.1}
  .auth-hero p{color:var(--muted);font-weight:600}
  .auth-tabs{display:flex;background:#eef1f8;border-radius:14px;padding:4px;margin-bottom:16px}
  .auth-tabs button{flex:1;padding:10px;border:none;background:none;font-size:16px;font-weight:800;color:var(--muted);border-radius:10px;transition:.2s}
  .auth-tabs button.active{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .keep{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:700;font-size:14px;cursor:pointer}
  .keep input{width:20px;height:20px;accent-color:var(--primary)}

  label{display:block;font-weight:800;font-size:14px;margin:12px 0 5px}
  input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-family:inherit;font-size:16px;font-weight:600;background:#fff;transition:.2s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-2);box-shadow:0 0 0 4px rgba(35,70,196,.12)}
  textarea{min-height:95px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.row{grid-template-columns:1fr}}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border:none;border-radius:12px;font-size:16px;font-weight:800;background:linear-gradient(135deg,var(--primary-2),var(--primary));color:#fff;text-decoration:none;transition:transform .15s, box-shadow .15s;box-shadow:0 6px 16px rgba(35,70,196,.3)}
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .btn.block{width:100%;margin-top:18px}
  .btn.light{background:#eef1f8;color:var(--primary);box-shadow:none}
  .btn.women{background:linear-gradient(135deg,var(--women),var(--women-2));box-shadow:0 6px 16px rgba(225,29,72,.35)}
  .btn.noise{background:linear-gradient(135deg,var(--noise),var(--noise-2));box-shadow:0 6px 16px rgba(124,58,237,.35)}
  .btn.white{background:#fff;color:var(--women);box-shadow:none}
  .btn.white.n{color:var(--noise)}

  .msg{padding:11px 14px;border-radius:12px;font-size:14px;font-weight:700;margin-top:12px}
  .msg.err{background:#fdecea;color:var(--danger)}
  .msg.ok{background:#e7f6ec;color:var(--ok)}
  .msg.info{background:#eaf0ff;color:var(--primary-2)}

  /* ---------- Home ---------- */
  .greet h2{font-size:26px;color:var(--primary);line-height:1.1}
  .greet p{color:var(--muted);font-weight:600;margin-bottom:14px}

  .featured{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  @media(max-width:700px){.featured{grid-template-columns:1fr}}
  .fcard{position:relative;border-radius:22px;padding:22px;color:#fff;overflow:hidden;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 14px 30px rgba(0,0,0,.18)}
  .fcard.women{background:linear-gradient(135deg,#f43f5e,#be185d 70%,#9d174d)}
  .fcard.noise{background:linear-gradient(135deg,#8b5cf6,#4338ca 75%,#312e81)}
  .fcard .badge-top{display:inline-block;background:rgba(255,255,255,.22);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:800;letter-spacing:.5px;width:max-content}
  .fcard h3{font-size:26px;margin-top:8px;line-height:1.1}
  .fcard p{font-weight:600;opacity:.95;margin:4px 0 14px;max-width:85%}
  .fcard .ic{position:absolute;right:-10px;top:-10px;font-size:110px;opacity:.18;transform:rotate(-12deg)}
  .fcard .acts{display:flex;gap:10px;flex-wrap:wrap}
  .fcard .pulse{position:absolute;right:22px;top:22px;width:14px;height:14px;border-radius:50%;background:#fff}
  .fcard .pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:#fff;animation:ping 1.6s infinite}
  @keyframes ping{to{transform:scale(3);opacity:0}}
  .bars{display:flex;gap:4px;align-items:flex-end;height:34px;position:absolute;right:22px;top:20px}
  .bars span{width:6px;background:#fff;border-radius:3px;animation:eq 1s ease-in-out infinite}
  .bars span:nth-child(2){animation-delay:.15s}.bars span:nth-child(3){animation-delay:.3s}
  .bars span:nth-child(4){animation-delay:.45s}.bars span:nth-child(5){animation-delay:.6s}
  @keyframes eq{0%,100%{height:8px}50%{height:34px}}

  .section-title{font-size:20px;color:var(--primary);margin:6px 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .tile{background:#fff;border:none;border-radius:18px;padding:18px 10px;text-align:center;box-shadow:var(--shadow);transition:transform .2s, box-shadow .2s;position:relative;overflow:hidden}
  .tile:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(20,40,107,.16)}
  .tile .ic{font-size:34px;display:block}
  .tile .nm{font-family:'Baloo 2';font-weight:800;font-size:16px;color:var(--primary);display:block;margin-top:6px;line-height:1.15}
  .tile::before{content:"";position:absolute;left:0;top:0;height:4px;width:100%;background:linear-gradient(90deg,var(--saffron),var(--primary-2))}

  .helplines{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #fbcfe8;color:var(--women-2);border-radius:30px;padding:7px 14px;font-weight:800;text-decoration:none;font-size:14px}
  .chip b{color:var(--text)}

  /* ---------- Form view ---------- */
  .back{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--border);border-radius:30px;padding:7px 16px;font-weight:800;color:var(--primary);margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .back:hover{border-color:var(--primary-2)}
  .form-head{border-radius:18px;padding:18px 20px;color:#fff;margin:-22px -22px 16px;background:linear-gradient(135deg,var(--primary-2),var(--primary))}
  .form-head.women{background:linear-gradient(135deg,var(--women),var(--women-2))}
  .form-head.noise{background:linear-gradient(135deg,var(--noise),var(--noise-2))}
  .form-head h2{font-size:24px;line-height:1.1}
  .form-head p{font-weight:600;opacity:.92;font-size:14px;margin-top:4px}

  .rakshak{background:#fff1f3;border:2px solid #fecdd3;padding:16px;border-radius:16px;margin-bottom:14px}
  .rakshak h3{color:var(--women);font-size:18px;margin-bottom:4px}
  .rakshak p{font-size:14px;font-weight:600;margin-bottom:10px}
  .rakshak .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .tips{list-style:none;display:grid;gap:6px;margin-top:6px}
  .tips li{font-size:14px;font-weight:600;padding-left:22px;position:relative}
  .tips li::before{content:"✔";position:absolute;left:0;color:var(--women)}

  .meter{background:#f5f3ff;border:2px solid #ddd6fe;padding:16px;border-radius:16px;margin-bottom:14px}
  .meter h3{color:var(--noise);font-size:18px}
  .meter p{font-size:14px;font-weight:600}
  .gauge{height:18px;background:#e9e5ff;border-radius:20px;overflow:hidden;margin:12px 0 6px}
  .gauge-fill{height:100%;width:0;background:#22c55e;border-radius:20px;transition:width .12s,background .3s}
  .meter-read{font-family:'Baloo 2';font-weight:800;font-size:34px;color:var(--noise);line-height:1}
  .meter-read small{font-size:16px}

  .photo-box{border:2px dashed #c7d0e3;border-radius:16px;padding:18px;text-align:center;background:#fafbff}
  .photo-box img{max-width:100%;border-radius:12px;margin-top:12px}
  .loc{font-size:14px;font-weight:600;color:var(--muted);margin-top:8px}
  .loc.good{color:var(--ok)}

  /* ---------- List ---------- */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  th{background:#f1f4fb;font-size:13px;color:var(--muted);font-weight:800}
  td b{color:var(--primary)}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:800}
  .b-open{background:#fff4e0;color:#b45309}
  .b-high{background:#fdecea;color:var(--danger)}
  .b-done{background:#e7f6ec;color:var(--ok)}
  .table-wrap{overflow-x:auto}

  /* ---------- Floating SOS + toast ---------- */
  .sos-fab{position:fixed;right:16px;bottom:18px;z-index:30;width:68px;height:68px;border-radius:50%;border:none;background:radial-gradient(circle at 30% 30%,#fb7185,var(--women) 60%,var(--women-2));color:#fff;font-family:'Baloo 2';font-weight:800;font-size:18px;box-shadow:0 10px 25px rgba(225,29,72,.5)}
  .sos-fab::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(225,29,72,.5);animation:ring 1.8s infinite}
  @keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:40;max-width:92%;padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:0 10px 25px rgba(0,0,0,.2)}

  .banner{background:#fff4e0;color:#8a5a00;font-size:13px;font-weight:700;padding:8px 12px;text-align:center}
  footer{text-align:center;color:var(--muted);font-size:13px;font-weight:600;padding:22px 14px 90px}
  .spinner{width:18px;height:18px;border:3px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- Language bar -->
<div class="topbar">
  <span class="tag" data-i18n="slogan"></span>
  <div class="lang">
    <button id="langEn" onclick="setLang('en')">English</button>
    <button id="langMr" onclick="setLang('mr')">मराठी</button>
  </div>
</div>

<div id="demoBanner" class="banner hidden" data-i18n="demo"></div>

<header>
  <div class="head-in">
    <div class="brand">
      <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sangamner Nagarpalika emblem">
        <defs>
          <radialGradient id="L-bg" cx="50%" cy="40%" r="65%"><stop offset="0" stop-color="#22398f"/><stop offset="1" stop-color="#0a1438"/></radialGradient>
          <linearGradient id="L-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1b0"/><stop offset=".45" stop-color="#e3a400"/><stop offset="1" stop-color="#ffd24d"/></linearGradient>
          <linearGradient id="L-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16307e"/><stop offset=".35" stop-color="#3d6fd4"/><stop offset=".62" stop-color="#ff9b3d"/><stop offset=".75" stop-color="#ffd27a"/></linearGradient>
          <radialGradient id="L-sun"><stop offset="0" stop-color="#fffbe0"/><stop offset=".6" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff9800"/></radialGradient>
          <linearGradient id="L-river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd8ff"/><stop offset=".35" stop-color="#2f8fe0"/><stop offset="1" stop-color="#0b3d91"/></linearGradient>
          <linearGradient id="L-land" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4caf50"/><stop offset="1" stop-color="#1b5e20"/></linearGradient>
          <linearGradient id="L-rib" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa53d"/><stop offset="1" stop-color="#e65c00"/></linearGradient>
          <clipPath id="L-clip"><circle cx="100" cy="100" r="68"/></clipPath>
          <path id="L-top" d="M24 100 A76 76 0 0 1 176 100"/>
          <path id="L-bot" d="M14 100 A86 86 0 0 0 186 100"/>
        </defs>

        <!-- outer seal -->
        <circle cx="100" cy="100" r="98" fill="url(#L-bg)"/>
        <circle cx="100" cy="100" r="95" fill="none" stroke="url(#L-gold)" stroke-width="3"/>
        <circle class="rot" cx="100" cy="100" r="91" fill="none" stroke="#ff8a1f" stroke-width="2" stroke-dasharray="1.5 5" stroke-linecap="round"/>
        <g class="ringtext" font-family="'Baloo 2','Mukta',sans-serif" font-weight="800" text-anchor="middle">
          <text font-size="15" fill="#ffe08a"><textPath href="#L-top" startOffset="50%">संगमनेर नगरपालिका</textPath></text>
          <text font-size="10.5" letter-spacing="1.6" fill="#ffe08a"><textPath href="#L-bot" startOffset="50%">SANGAMNER NAGARPALIKA</textPath></text>
          <circle cx="16" cy="100" r="3" fill="#ff8a1f"/><circle cx="184" cy="100" r="3" fill="#ff8a1f"/>
        </g>

        <!-- landscape -->
        <g clip-path="url(#L-clip)">
          <rect x="30" y="30" width="140" height="140" fill="url(#L-sky)"/>
          <!-- birds -->
          <g class="birds" fill="none" stroke="#0f1f55" stroke-width="1.3" stroke-linecap="round">
            <path d="M34 58 q3 -3 6 0 q3 -3 6 0"/><path d="M46 52 q2.5 -2.5 5 0 q2.5 -2.5 5 0"/><path d="M40 47 q2 -2 4 0 q2 -2 4 0"/>
          </g>
          <!-- rising sun -->
          <circle class="glow" cx="100" cy="96" r="30" fill="#ffe08a" opacity=".35"/>
          <circle class="rays" cx="100" cy="96" r="27" fill="none" stroke="#fff0b8" stroke-width="12" stroke-dasharray="2.2 4.8" opacity=".65"/>
          <circle cx="100" cy="96" r="15" fill="url(#L-sun)"/>
          <!-- Sahyadri ranges -->
          <path d="M30 108 L46 94 L56 99 L70 86 L84 97 L96 93 L110 99 L126 83 L140 96 L154 89 L170 101 V125 H30Z" fill="#46648f" opacity=".9"/>
          <path d="M30 112 Q52 99 76 109 T126 105 T170 109 V125 H30Z" fill="#2f6b3a"/>
          <!-- banks -->
          <rect x="30" y="111" width="140" height="62" fill="url(#L-land)"/>
          <!-- temple on the ghat -->
          <g>
            <path d="M43 113 V105 H45.5 L50 92 L54.5 105 H57 V113Z" fill="#8a3412"/>
            <path d="M47 105 H53 V113 H47Z" fill="#5a1f08"/>
            <circle cx="50" cy="91" r="1.4" fill="#ffd24d"/>
            <line x1="50" y1="91" x2="50" y2="83" stroke="#5a1f08" stroke-width=".8"/>
            <path class="flag" d="M50 83 L57 85 L50 87Z" fill="#ff7a00"/>
            <path d="M38 113 h24 v2 h-22 v2 h-20Z" fill="#c9b79c" opacity=".9"/>
          </g>
          <!-- city skyline -->
          <path d="M120 113 V103 h6 v-5 h5 v15 h3 V96 h7 v17 h4 v-9 h6 v9 h4 V104 h6 v9Z" fill="#1d2b5a"/>
          <g fill="#ffd27a"><rect class="tw" x="128" y="101" width="1.6" height="1.6"/><rect class="tw t2" x="136" y="99" width="1.6" height="1.6"/><rect class="tw" x="136" y="104" width="1.6" height="1.6"/><rect class="tw t2" x="147" y="106" width="1.6" height="1.6"/><rect class="tw t3" x="157" y="107" width="1.6" height="1.6"/><rect class="tw t3" x="122" y="106" width="1.6" height="1.6"/></g>
          <!-- Amrutvahini Pravara river -->
          <path d="M93 112 H107 C116 126 138 139 172 148 V172 H28 V148 C62 139 84 126 93 112Z" fill="url(#L-river)"/>
          <g fill="#ffe08a"><ellipse class="shim" cx="100" cy="117" rx="3" ry=".9"/><ellipse class="shim s2" cx="100" cy="122" rx="5" ry="1.1"/><ellipse class="shim s3" cx="100" cy="128" rx="7.5" ry="1.3"/><ellipse class="shim s2" cx="100" cy="135" rx="10" ry="1.5"/></g>
          <g fill="none" stroke="#e6f6ff" stroke-linecap="round" opacity=".75">
            <path class="flow" d="M84 126 Q100 123 116 126" stroke-width="1" stroke-dasharray="5 7"/>
            <path class="flow f2" d="M70 135 Q100 131 130 135" stroke-width="1.3" stroke-dasharray="7 9"/>
            <path class="flow" d="M52 144 Q100 139 148 144" stroke-width="1.5" stroke-dasharray="9 10"/>
            <path class="flow f2" d="M36 153 Q100 147 164 153" stroke-width="1.7" stroke-dasharray="11 12"/>
          </g>
        </g>
        <circle cx="100" cy="100" r="69" fill="none" stroke="url(#L-gold)" stroke-width="3"/>

async function sha256(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}

/* =========================================================
   API – Google Apps Script backend (unchanged)
   ========================================================= */
async function parseReply(r){
  const text = await r.text();
  try { return JSON.parse(text); }
  catch(e){
    if (/accounts\.google\.com|ServiceLogin|Sign in/i.test(text))
      throw new Error("Backend asks for Google sign-in. Redeploy the Apps Script with 'Who has access: Anyone'.");
    if (/authoriz|permission/i.test(text))
      throw new Error("Apps Script is not authorized. Open the script, run setup() once and allow access.");
    if (/not found|unable to open|404/i.test(text))
      throw new Error("Web App URL is wrong or the deployment was deleted. Copy the latest /exec URL.");
    const plain = text.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/gi," ")
                      .replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim().slice(0,250);
    console.log("Backend raw reply:", text);
    throw new Error("Backend did not return JSON (HTTP " + r.status + "). Google says: \"" + plain + "\"");
  }
}

async function api(action, data){
  if (CONFIG.SCRIPT_URL){
    const r = await fetch(CONFIG.SCRIPT_URL, {
      method:"POST",
      redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({action, ...data})
    });
    return parseReply(r);
  }
  return demoApi(action, data);
}

async function checkBackend(){
  if (!CONFIG.SCRIPT_URL) return;
  const b = $("demoBanner");
  try{
    const r = await fetch(CONFIG.SCRIPT_URL + "?action=ping", {redirect:"follow"});
    const j = await parseReply(r);
    if (!j.ok) throw new Error(j.error);
  }catch(err){
    b.style.background="#fdecea"; b.style.color="#c0392b";
    b.removeAttribute("data-i18n");
    b.innerHTML = t("backendFail") + err.message;
    b.classList.remove("hidden");
  }
}

function demoApi(action, d){
  const users = JSON.parse(localStorage.getItem("cs_users")||"{}");
  const comps = JSON.parse(localStorage.getItem("cs_comps")||"[]");
  if (action==="register"){
    if (users[d.mobile]) return {ok:false, error:"This mobile number is already registered."};
    users[d.mobile] = {...d, created:new Date().toISOString()};
    localStorage.setItem("cs_users", JSON.stringify(users));
    return {ok:true};
  }
  if (action==="login"){
    const u = users[d.mobile];
    if (!u || u.passwordHash!==d.passwordHash) return {ok:false, error:"Invalid mobile number or password."};
    const {passwordHash, ...safe} = u; return {ok:true, user:safe};
  }
  if (action==="complaint"){
    const {docxBase64, ...c} = d;
    comps.push({...c, status:"Open"});
    localStorage.setItem("cs_comps", JSON.stringify(comps));
    return {ok:true, id:c.id};
  }
  if (action==="list") return {ok:true, complaints: comps.filter(c=>c.mobile===d.mobile).reverse()};
  return {ok:false, error:"Unknown action"};
}

/* =========================================================
   NOISE METER (phone microphone, approximate dB)
   ========================================================= */
const meter = {running:false};
function levelText(db){
  return db<=45 ? [t("lvlQuiet"),"#22c55e"] : db<=55 ? [t("lvlOk"),"#eab308"] : db<=70 ? [t("lvlLoud"),"#f97316"] : [t("lvlHarm"),"#dc2626"];
}
function resetMeter(){
  noise = null; $("mNow").textContent="--"; $("gFill").style.width="0"; msg("mResult","");
  $("meterBtn").textContent = t("startMeter");
}
async function startMeter(){
  if (meter.running) return;
  try{
    meter.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  }catch(e){ msg("mResult", t("micDenied")); return; }
  meter.ctx = new (window.AudioContext||window.webkitAudioContext)();
  const src = meter.ctx.createMediaStreamSource(meter.stream);
  const an = meter.ctx.createAnalyser(); an.fftSize = 2048; src.connect(an);
  const buf = new Float32Array(an.fftSize);
  let sum=0, n=0, peak=0; const end = Date.now()+10000;
  meter.running = true; $("meterBtn").disabled = true; $("meterBtn").textContent = t("measuring"); msg("mResult","");

  const tick = ()=>{
    if (!meter.running) return;
    an.getFloatTimeDomainData(buf);
    let s=0; for (let i=0;i<buf.length;i++) s+=buf[i]*buf[i];
    const rms = Math.sqrt(s/buf.length);
    const db = Math.max(30, Math.min(120, Math.round(20*Math.log10(rms||1e-8) + 100)));
    sum+=db; n++; peak=Math.max(peak,db);
    const [, col] = levelText(db);
    $("mNow").textContent = db; $("gFill").style.width = ((db-30)/90*100)+"%"; $("gFill").style.background = col;
    if (Date.now() < end) meter.raf = requestAnimationFrame(tick);
    else {
      stopMeter();
      noise = {avg:Math.round(sum/n), peak};
      const [txt, c2] = levelText(noise.avg);
      $("mNow").textContent = noise.avg;
      $("mResult").innerHTML = `<div class="msg" style="background:#fff;border:2px solid ${c2};color:${c2}">
        ${t("avg")}: <b>${noise.avg} dB</b> · ${t("peak")}: <b>${noise.peak} dB</b><br>${txt}</div>`;
      $("meterBtn").textContent = t("measureAgain");
    }
  };
  tick();
}
function stopMeter(){
  if (meter.raf) cancelAnimationFrame(meter.raf);
  if (meter.stream) meter.stream.getTracks().forEach(tr=>tr.stop());
  if (meter.ctx) meter.ctx.close().catch(()=>{});
  meter.running=false; meter.stream=null; meter.ctx=null;
  if ($("meterBtn")) $("meterBtn").disabled=false;
}

/* =========================================================
   GEOLOCATION + GEOTAGGED PHOTO
   ========================================================= */
function getLocation(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error("Geolocation not supported on this device."));
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy)}),
      e=>rej(new Error(e.code===1?"Location permission denied. Please allow location access.":"Could not get location. Turn on GPS and try again.")),
      {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  });
}

async function reverseGeocode(lat,lng){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=17`);
    const j = await r.json(); return j.display_name || "";
  }catch(e){ return ""; }
}

function resetPhoto(){

async function handlePhoto(e){
  const file = e.target.files[0]; if(!file) return;
  let loc;
  try{ loc = await (locPromise || getLocation()); }
  catch(err){ $("locStatus").className="loc"; $("locStatus").innerHTML=`<span style="color:var(--danger)">${err.message}</span>`; return; }

  $("locStatus").textContent=t("stamping");
  const time = new Date();
  const place = await reverseGeocode(loc.lat, loc.lng);
  const dataUrl = await stampPhoto(file, loc, time, place);
  photo = {dataUrl, ...loc, time:time.toISOString(), place};

  $("photoPreview").src = dataUrl; $("photoPreview").classList.remove("hidden");
  $("locStatus").className="loc good";
  $("locStatus").innerHTML = `✅ ${loc.lat.toFixed(6)}, ${loc.lng.toFixed(6)} (±${loc.acc} m)<br>${place||""}`;
}

function stampPhoto(file, loc, time, place){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const max=1280, s=Math.min(1, max/Math.max(img.width,img.height));
      const w=Math.round(img.width*s), h=Math.round(img.height*s);
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      const ctx=cv.getContext("2d"); ctx.drawImage(img,0,0,w,h);

      const fs=Math.max(14,Math.round(w/45));
      const lines=[
        `${CONFIG.CORP_NAME} · Civic Sense AI`,
        `Lat: ${loc.lat.toFixed(6)}  Long: ${loc.lng.toFixed(6)}  (±${loc.acc} m)`,
        time.toLocaleString("en-IN"),
      ];
      if(place) lines.push(place.length>80 ? place.slice(0,80)+"…" : place);
      const pad=fs*0.6, bandH=lines.length*fs*1.35+pad*2;
      ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,h-bandH,w,bandH);
      ctx.fillStyle="#fff"; ctx.font=`700 ${fs}px Mukta, sans-serif`; ctx.textBaseline="top";
      lines.forEach((tx,i)=>ctx.fillText(tx,pad,h-bandH+pad+i*fs*1.35,w-pad*2));
      resolve(cv.toDataURL("image/jpeg",0.85));
      URL.revokeObjectURL(img.src);
    };
    img.onerror=()=>reject(new Error("Could not read the photo."));
    img.src=URL.createObjectURL(file);
  });
}

function makeId(prefix){

async function submitComplaint(e){
  e.preventDefault();
  if(!photo) return msg("submitMsg", t("photoReq"));
  const btn=$("submitBtn"); busy(btn,true,t("submitting"));

  let desc = $("cDesc").value.trim();
  if (current.meter && noise) desc += `\n[Noise meter reading (approx.): average ${noise.avg} dB, peak ${noise.peak} dB]`;

  const c = {
    id: makeId(current.cert ? "CERT" : "CMP"),
    date: new Date().toISOString(),
    mobile:user.mobile, name:user.name, ward:user.ward, address:user.address,
    category: `${current.en} (${current.mr})`,
    subType: $("cSub").value,
    description: desc,
    landmark: $("cLandmark").value.trim(),
    applicant: current.cert ? $("cApplicant").value.trim() : "",
    purpose: current.cert ? $("cPurpose").value.trim() : "",
    priority: current.cert ? "Normal" : $("cPriority").value,
    rakshak: !!current.rakshak,
    noise: current.meter && noise ? noise : null,
    lat: photo.lat, lng: photo.lng, accuracy: photo.acc, place: photo.place, photoTime: photo.time
  };

  try{
    const blob = await buildDocx(c);
    const docxBase64 = await blobToBase64(blob);
    const res = await api("complaint",{...c, docxBase64});
    if(!res.ok) throw new Error(res.error||"Server error");

    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`${c.id}.docx`; a.click();

    msg("submitMsg",`${t("submitOk")}<br>${t("cid")}: <b>${c.id}</b>${c.rakshak?"<br>"+t("fwdRk"):""}<br>${t("docDl")}`,"ok");
    $("complaintForm").reset(); resetPhoto(); resetMeter();
    if(current.cert) $("cApplicant").value=user.name;
    if(current.rakshak) $("cPriority").value="High";
  }catch(err){ msg("submitMsg",t("submitFail")+err.message); }
  busy(btn,false);
}

function blobToBase64(blob){
  return new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result.split(",")[1]); fr.readAsDataURL(blob); });
}
function dataUrlToBytes(u){ const b=atob(u.split(",")[1]); const a=new Uint8Array(b.length); for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i); return a; }

async function buildDocx(c){
  const {Document,Packer,Paragraph,TextRun,ImageRun,Table,TableRow,TableCell,WidthType,AlignmentType,HeadingLevel} = docx;

  const cell=(tx,bold,shade)=>new TableCell({
    width:{size:bold?30:70,type:WidthType.PERCENTAGE},
    shading: shade?{fill:"EAF0FF"}:undefined,
    children:[new Paragraph({children:[new TextRun({text:String(tx||"—"),bold})]})]
  });
  const rows = [
    ["Complaint ID", c.id],
    ["Date & Time", new Date(c.date).toLocaleString("en-IN")],
    ["Citizen Name", c.name],
    ["Mobile", c.mobile],
    ["Ward", c.ward],
    ["Residential Address", c.address],
    ["Category", c.category],
    [c.applicant?"Certificate Type":"Issue Type", c.subType],
    ...(c.applicant ? [["Applicant Name",c.applicant],["Purpose",c.purpose]] : [["Urgency",c.priority]]),
    ...(c.rakshak ? [["Assigned To","Rakshak Dal (Nagarpalika Security Force)"]] : []),
    ...(c.noise ? [["Measured Noise (approx.)",`Average ${c.noise.avg} dB, Peak ${c.noise.peak} dB`]] : []),
    ["Landmark / Location", c.landmark],
    ["GPS Coordinates", `${c.lat.toFixed(6)}, ${c.lng.toFixed(6)} (±${c.accuracy} m)`],
    ["Detected Address", c.place],
    ["Google Maps Link", `https://maps.google.com/?q=${c.lat},${c.lng}`],
    ["Photo Taken At", new Date(c.photoTime).toLocaleString("en-IN")]
  ].map(([k,v])=>new TableRow({children:[cell(k,true,true),cell(v)]}));

  const img = new Image(); img.src = photo.dataUrl; await img.decode();
  const pw = 450, ph = Math.round(pw*img.height/img.width);

  const doc = new Document({
    styles:{default:{document:{run:{font:"Mangal",size:22}}}},
    sections:[{children:[
      new Paragraph({alignment:AlignmentType.CENTER,heading:HeadingLevel.HEADING_1,children:[new TextRun({text:CONFIG.CORP_NAME_MR,bold:true,size:36})]}),
      new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:CONFIG.CORP_NAME,bold:true,size:30})]}),
      new Paragraph({alignment:AlignmentType.CENTER,children:[new TextRun({text:"Civic Sense AI – Citizen "+(c.applicant?"Certificate Application":"Complaint"),size:26})]}),
      new Paragraph({alignment:AlignmentType.CENTER,spacing:{after:200},children:[new TextRun({text:`Category: ${c.category}`,italics:true})]}),
      new Table({width:{size:100,type:WidthType.PERCENTAGE},rows}),
      new Paragraph({spacing:{before:300,after:100},children:[new TextRun({text:"Description",bold:true,size:26})]}),
      ...c.description.split("\n").map(line=>new Paragraph({children:[new TextRun(line)]})),
      new Paragraph({spacing:{before:300,after:100},children:[new TextRun({text:"Geotagged Photograph",bold:true,size:26})]}),
      new Paragraph({alignment:AlignmentType.CENTER,children:[new ImageRun({data:dataUrlToBytes(photo.dataUrl),transformation:{width:pw,height:ph}})]}),
      new Paragraph({spacing:{before:400},children:[new TextRun({text:"Declaration: I confirm that the information given above is true to the best of my knowledge.",size:20})]}),
      new Paragraph({spacing:{before:400},alignment:AlignmentType.RIGHT,children:[new TextRun({text:`(${c.name})`,bold:true})]}),
      new Paragraph({alignment:AlignmentType.RIGHT,children:[new TextRun({text:"Citizen",size:20})]})
    ]}]
  });
  return Packer.toBlob(doc);
}

/* =========================================================
   MY COMPLAINTS
   ========================================================= */
function statusText(st){
  const m = {open:"stOpen","in progress":"stProgress",resolved:"stResolved",closed:"stClosed"};
  const k = m[String(st||"Open").toLowerCase()]; return k ? t(k) : st;
}
function catText(cat){
  const c = CATEGORIES.find(x=>String(cat||"").startsWith(x.en)); return c ? L([c.en,c.mr]) : cat;
}
function subText(cat, sub){
  for (const c of CATEGORIES){ const s=(c.subs||[]).find(p=>p[0]===sub); if(s) return L(s); }
  return sub;
}
async function loadList(){
  $("listBody").innerHTML=`<tr><td colspan="5">${t("loading")}</td></tr>`; msg("listMsg","");
  try{
    const res = await api("list",{mobile:user.mobile});
    const list = res.complaints||[];
    if(!list.length){ $("listBody").innerHTML=`<tr><td colspan="5">${t("noComplaints")}</td></tr>`; return; }
    $("listBody").innerHTML = list.map(c=>{
      const st=(c.status||"Open"), cls=/resolv|clos|issued/i.test(st)?"b-done":(c.priority==="Emergency"||c.priority==="High")?"b-high":"b-open";
      return `<tr><td><b>${c.id}</b></td><td>${fmtDate(c.date)}</td><td>${catText(c.category)}</td><td>${subText(c.category,c.subType)}</td><td><span class="badge ${cls}">${statusText(st)}</span></td></tr>`;
    }).join("");
  }catch(err){ $("listBody").innerHTML=""; msg("listMsg",t("loadFail")+err.message); }
}
